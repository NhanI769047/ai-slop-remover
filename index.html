<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Slop Remover</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f17;
    --surface: #1a1a28;
    --border: #2e2e45;
    --accent: #a855f7;
    --accent2: #ec4899;
    --red: #ff4d6d;
    --green: #10d98a;
    --yellow: #f59e0b;
    --text: #e2e2f0;
    --muted: #8888aa;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 32px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p { color: var(--muted); font-size: 0.85rem; }

  .main { flex: 1; display: flex; flex-direction: column; padding: 20px 32px; gap: 14px; }

  .panels { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; flex: 1; }

  .panel { display: flex; flex-direction: column; gap: 8px; }

  .panel-header { display: flex; justify-content: space-between; align-items: center; }

  .panel-label {
    font-size: 0.78rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  }

  .badge {
    font-size: 0.75rem; padding: 3px 10px;
    border-radius: 99px; font-weight: 600;
  }
  .badge-red    { background: rgba(255,77,109,0.15); color: var(--red); }
  .badge-green  { background: rgba(16,217,138,0.15); color: var(--green); }
  .badge-hidden { visibility: hidden; }

  textarea {
    flex: 1; width: 100%; min-height: 400px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.92rem; line-height: 1.65; padding: 16px;
    resize: vertical; outline: none; transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea[readonly] { color: #c8c8e8; cursor: default; }

  .center-col {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; padding-top: 26px;
  }

  .btn-clean {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px; color: #fff; cursor: pointer;
    font-size: 0.9rem; font-weight: 700; padding: 12px 20px;
    white-space: nowrap; transition: opacity 0.15s, transform 0.1s;
  }
  .btn-clean:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-clean:active { transform: translateY(0); }

  .btn-copy {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); cursor: pointer; font-size: 0.78rem; padding: 6px 12px;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-copy:hover { border-color: var(--accent); color: var(--accent); }

  .btn-clear {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 0.78rem; padding: 4px 8px; border-radius: 6px;
  }
  .btn-clear:hover { color: var(--red); }

  .stats {
    display: flex; flex-wrap: wrap; gap: 20px;
    padding: 12px 0 0; border-top: 1px solid var(--border);
  }

  .stat { display: flex; flex-direction: column; gap: 2px; }

  .stat-val {
    font-size: 1.15rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .stat-val.red    { color: var(--red); }
  .stat-val.green  { color: var(--green); }
  .stat-val.yellow { color: var(--yellow); }
  .stat-val.accent { color: var(--accent); }

  .flesh-bar {
    display: flex; align-items: center; gap: 8px; margin-top: 2px;
  }
  .flesh-track {
    width: 80px; height: 6px; background: var(--border);
    border-radius: 99px; overflow: hidden;
  }
  .flesh-fill {
    height: 100%; border-radius: 99px;
    transition: width 0.4s, background 0.4s;
  }

  .highlight-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.8rem; color: var(--muted); cursor: pointer; user-select: none;
  }
  .highlight-toggle input[type=checkbox] { accent-color: var(--accent); }

  .preview-box {
    display: none; flex: 1; min-height: 400px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    font-size: 0.92rem; line-height: 1.65; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .preview-box mark {
    background: rgba(255,77,109,0.25); color: var(--red);
    border-radius: 3px; padding: 0 2px;
  }

  /* Output diff display */
  .output-display {
    flex: 1; min-height: 400px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    font-size: 0.92rem; line-height: 1.75; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
    color: var(--text);
  }
  .output-display:empty::before {
    content: 'Cleaned text will appear here…';
    color: var(--muted);
  }
  .diff-del {
    background: rgba(255,77,109,0.18);
    color: var(--red);
    text-decoration: line-through;
    border-radius: 3px;
    padding: 0 2px;
  }
  .diff-add {
    background: rgba(16,217,138,0.15);
    color: var(--green);
    border-radius: 3px;
    padding: 0 2px;
  }

  .found-list {
    display: none; margin-top: 4px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 0.8rem;
    line-height: 1.8; color: var(--muted);
    max-height: 120px; overflow-y: auto;
  }
  .found-list span {
    display: inline-block;
    background: rgba(255,77,109,0.12); color: var(--red);
    border-radius: 4px; padding: 1px 8px;
    margin: 2px 4px 2px 0; font-weight: 500;
  }

  .divider { width: 1px; height: 28px; background: var(--border); }
</style>
</head>
<body>

<header>
  <h1>AI Slop Remover</h1>
  <p>Paste text → get direct, human prose back</p>
</header>

<div class="main">
  <div class="panels">

    <!-- INPUT -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Input</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <span id="badge-slop" class="badge badge-red badge-hidden">0 slop</span>
          <button class="btn-clear" onclick="clearAll()">✕ clear</button>
        </div>
      </div>
      <textarea id="input" placeholder="Paste your AI-generated text here…" oninput="onInput()"></textarea>
      <label class="highlight-toggle">
        <input type="checkbox" id="highlight-toggle" onchange="toggleHighlight()">
        Highlight slop phrases
      </label>
      <div id="preview-in" class="preview-box"></div>
      <div id="found-list" class="found-list"></div>
    </div>

    <!-- CENTER -->
    <div class="center-col">
      <button class="btn-clean" onclick="clean()">Clean It →</button>
    </div>

    <!-- OUTPUT -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Output</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <span id="badge-clean" class="badge badge-green badge-hidden">0 fixed</span>
          <label class="highlight-toggle" style="margin:0;">
            <input type="checkbox" id="diff-toggle" checked onchange="toggleDiff()">
            Show changes
          </label>
          <button class="btn-copy" onclick="copyOutput()">Copy</button>
        </div>
      </div>
      <div id="output-display" class="output-display"></div>
      <textarea id="output" style="display:none;" readonly></textarea>
    </div>

  </div>

  <div class="stats">
    <div class="stat">
      <span id="stat-in-words" class="stat-val accent">—</span>
      <span class="stat-label">Input words</span>
    </div>
    <div class="stat">
      <span id="stat-out-words" class="stat-val accent">—</span>
      <span class="stat-label">Output words</span>
    </div>
    <div class="stat">
      <span id="stat-slop" class="stat-val red">—</span>
      <span class="stat-label">Slop removed</span>
    </div>
    <div class="stat">
      <span id="stat-format" class="stat-val green">—</span>
      <span class="stat-label">Emoji &amp; dashes stripped</span>
    </div>
    <div class="stat">
      <span id="stat-contractions" class="stat-val green">—</span>
      <span class="stat-label">Contractions added</span>
    </div>
    <div class="stat">
      <span id="stat-bloat" class="stat-val green">—</span>
      <span class="stat-label">Bloat phrases cut</span>
    </div>
    <div class="stat">
      <span id="stat-splits" class="stat-val green">—</span>
      <span class="stat-label">Sentences split</span>
    </div>
    <div class="stat">
      <span id="stat-intensifiers" class="stat-val green">—</span>
      <span class="stat-label">Intensifiers stripped</span>
    </div>
    <div class="stat">
      <div class="flesh-bar">
        <span id="stat-flesch" class="stat-val yellow">—</span>
        <div class="flesh-track"><div id="flesch-fill" class="flesh-fill" style="width:0%"></div></div>
      </div>
      <span class="stat-label">Flesch score (target ≥60)</span>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════
// 1. SLOP RULES  — buzzwords, filler, sycophancy
// ═══════════════════════════════════════════════════════
const SLOP_RULES = [

  // Sycophantic openers
  { label: "Certainly!",          pattern: /\bCertainly[!,]?\s*/gi,                    r: "" },
  { label: "Absolutely!",         pattern: /\bAbsolutely[!,]?\s*/gi,                   r: "" },
  { label: "Of course!",          pattern: /\bOf course[!,]?\s*/gi,                    r: "" },
  { label: "Sure,",               pattern: /\bSure[!,]\s*/gi,                          r: "" },
  { label: "Great question",      pattern: /\bGreat question[!.]?\s*/gi,               r: "" },
  { label: "Excellent question",  pattern: /\bExcellent question[!.]?\s*/gi,            r: "" },
  { label: "Good question",       pattern: /\bGood question[!.]?\s*/gi,                r: "" },
  { label: "I'd be happy to",     pattern: /\bI'?d be (happy|glad) to\b/gi,            r: "I would be pleased to" },
  { label: "I'd love to help",    pattern: /\bI'?d love to help\b/gi,                  r: "" },
  { label: "I'm here to help",    pattern: /\bI'?m here to help\b/gi,                  r: "" },
  { label: "As an AI",            pattern: /\bAs an AI( language model)?,?\s*/gi,       r: "" },
  { label: "As a language model", pattern: /\bAs a language model,?\s*/gi,             r: "" },

  // Filler transitions
  { label: "In conclusion",       pattern: /\bIn conclusion[,:]?\s*/gi,                r: "" },
  { label: "In summary",          pattern: /\bIn summary[,:]?\s*/gi,                   r: "" },
  { label: "To summarize",        pattern: /\bTo summarize[,:]?\s*/gi,                 r: "" },
  { label: "To conclude",         pattern: /\bTo conclude[,:]?\s*/gi,                  r: "" },
  { label: "In essence",          pattern: /\bIn essence[,:]?\s*/gi,                   r: "" },
  { label: "Furthermore",         pattern: /\bFurthermore[,:]?\s*/gi,                  r: "" },
  { label: "Moreover",            pattern: /\bMoreover[,:]?\s*/gi,                     r: "" },
  { label: "Additionally",        pattern: /\bAdditionally[,:]?\s*/gi,                 r: "" },
  { label: "Having said that",    pattern: /\bHaving said that[,.]?\s*/gi,             r: "" },
  { label: "That being said",     pattern: /\bThat being said[,.]?\s*/gi,              r: "" },
  { label: "With that in mind",   pattern: /\bWith that in mind[,.]?\s*/gi,            r: "" },
  { label: "All things considered",pattern: /\bAll things considered[,.]?\s*/gi,       r: "" },
  { label: "At the end of the day",pattern: /\bAt the end of the day[,.]?\s*/gi,       r: "" },
  { label: "Needless to say",     pattern: /\bNeedless to say[,.]?\s*/gi,              r: "" },
  { label: "It goes without saying",pattern:/\bIt goes without saying (that )?/gi,     r: "" },
  { label: "It is worth noting",  pattern: /\bIt(?:'s| is) worth noting that\s*/gi,    r: "" },
  { label: "It is important to note",pattern:/\bIt(?:'s| is) important to note that\s*/gi, r: "" },
  { label: "It is crucial to note",pattern:/\bIt(?:'s| is) crucial to note that\s*/gi,r: "" },
  { label: "Please note that",    pattern: /\bPlease note that\s*/gi,                  r: "" },
  { label: "Note that",           pattern: /\bNote that\s*/gi,                         r: "" },
  { label: "It should be noted",  pattern: /\bIt should be noted that\s*/gi,           r: "" },
  { label: "Ultimately",          pattern: /\bUltimately[,.]?\s*/gi,                   r: "" },
  { label: "As a matter of fact", pattern: /\bAs a matter of fact[,.]?\s*/gi,          r: "" },

  // Padding / hedging
  { label: "I must emphasize",    pattern: /\bI must emphasize\s*/gi,                  r: "" },
  { label: "I cannot stress enough",pattern:/\bI cannot stress (this )?enough[,:]?\s*/gi, r: "" },
  { label: "Rest assured",        pattern: /\bRest assured[,.]?\s*/gi,                 r: "" },
  { label: "Look no further",     pattern: /\blook no further\b/gi,                    r: "look here" },
  { label: "the perfect solution", pattern: /\bthe perfect solution\b/gi,              r: "a solution" },
  { label: "the ultimate guide",  pattern: /\bthe ultimate guide\b/gi,                 r: "a guide" },
  { label: "the definitive guide",pattern: /\bthe definitive guide\b/gi,               r: "a guide" },
  { label: "it is crucial to",    pattern: /\bit(?:'s| is) crucial to\b/gi,            r: "it is important to" },
  { label: "it is essential to",  pattern: /\bit(?:'s| is) essential to\b/gi,          r: "it is important to" },
  { label: "it is vital to",      pattern: /\bit(?:'s| is) vital to\b/gi,              r: "it is important to" },
  { label: "it is necessary to",  pattern: /\bit(?:'s| is) necessary to\b/gi,          r: "it is important to" },
  { label: "the fact that",       pattern: /\bthe fact that\b/gi,                      r: "that" },

  // Buzzwords
  { label: "delve into",          pattern: /\bdelve into\b/gi,                         r: "examine" },
  { label: "dive deep into",      pattern: /\bdive deeply? into\b/gi,                  r: "examine" },
  { label: "dive into",           pattern: /\bdive into\b/gi,                          r: "look at" },
  { label: "deep dive",           pattern: /\bdeep[- ]dive(s|d|ing)?\b/gi,             r: "detailed look" },
  { label: "leverage",            pattern: /\bleverag(e|ing|ed)\b(?! ratio| buyout| effect)/gi,
                                    r: (m) => m.endsWith('ing') ? "using" : m.endsWith('ed') ? "used" : "use" },
  { label: "harness",             pattern: /\bharness(es|ed|ing)?\b/gi,                r: "use" },
  { label: "seamlessly",          pattern: /\bseamlessly\b/gi,                         r: "" },
  { label: "seamless",            pattern: /\bseamless\b/gi,                           r: "smooth" },
  { label: "robust",              pattern: /\brobust\b/gi,                             r: "reliable" },
  { label: "comprehensive",       pattern: /\bcomprehensive\b/gi,                      r: "complete" },
  { label: "cutting-edge",        pattern: /\bcutting[- ]edge\b/gi,                    r: "latest" },
  { label: "state-of-the-art",    pattern: /\bstate[- ]of[- ]the[- ]art\b/gi,          r: "current" },
  { label: "bleeding-edge",       pattern: /\bbleeding[- ]edge\b/gi,                   r: "latest" },
  { label: "unprecedented",       pattern: /\bunprecedented\b/gi,                      r: "new" },
  { label: "revolutionize",       pattern: /\brevolutioniz(e|es|ed|ing)\b/gi,
                                    r: (m) => m.endsWith('ing') ? "changing" : m.endsWith('ed') ? "changed" : "change" },
  { label: "game-changer",        pattern: /\bgame[- ]chang(er|ing)\b/gi,              r: "major shift" },
  { label: "paradigm shift",      pattern: /\bparadigm shift\b/gi,                     r: "major change" },
  { label: "paradigm",            pattern: /\bparadigm\b/gi,                           r: "model" },
  { label: "synergy",             pattern: /\bsynerg(y|ies|istic)\b/gi,                r: "combined effect" },
  { label: "empower",             pattern: /\bempower(s|ed|ing)?\b/gi,
                                    r: (m) => m.endsWith('ing') ? "enabling" : m.endsWith('ed') ? "enabled" : m.endsWith('s') ? "enables" : "enable" },
  { label: "unleash",             pattern: /\bunleash(es|ed|ing)?\b/gi,                r: "release" },
  { label: "elevate",             pattern: /\belevat(e|es|ed|ing)\b/gi,
                                    r: (m) => m.endsWith('ing') ? "improving" : m.endsWith('ed') ? "improved" : "improve" },
  { label: "transformative",      pattern: /\btransformative\b/gi,                     r: "significant" },
  { label: "innovative solution", pattern: /\binnovative solution(s)?\b/gi,            r: "solution" },
  { label: "innovative",          pattern: /\binnovative\b/gi,                         r: "new" },
  { label: "innovation",          pattern: /\binnovation\b/gi,                         r: "improvement" },
  { label: "streamline",          pattern: /\bstreamlin(e|es|ed|ing)\b/gi,
                                    r: (m) => m.endsWith('ing') ? "simplifying" : m.endsWith('ed') ? "simplified" : "simplify" },
  { label: "thought leadership",  pattern: /\bthought leaders?hip\b/gi,                r: "expertise" },
  { label: "thought leader",      pattern: /\bthought leaders?\b/gi,                   r: "expert" },
  { label: "best-in-class",       pattern: /\bbest[- ]in[- ]class\b/gi,                r: "top" },
  { label: "world-class",         pattern: /\bworld[- ]class\b/gi,                     r: "excellent" },
  { label: "next-generation",     pattern: /\bnext[- ]gen(eration)?\b/gi,              r: "new" },
  { label: "future-proof",        pattern: /\bfuture[- ]proof(ing|ed)?\b/gi,           r: "durable" },
  { label: "user-friendly",       pattern: /\buser[- ]friendly\b/gi,                   r: "easy to use" },
  { label: "value-added",         pattern: /\bvalue[- ]add(ed|s)?\b/gi,                r: "useful" },
  { label: "mission-critical",    pattern: /\bmission[- ]critical\b/gi,                r: "critical" },
  { label: "at your fingertips",  pattern: /\bat (your|their|our) fingertips\b/gi,     r: "available" },
  { label: "out of the box",      pattern: /\bout[- ]of[- ]the[- ]box\b/gi,            r: "by default" },
  { label: "multifaceted",        pattern: /\bmultifaceted\b/gi,                       r: "varied" },
  { label: "nuanced",             pattern: /\bnuanced\b/gi,                            r: "detailed" },
  { label: "disruptive",          pattern: /\bdisruptive\b/gi,                         r: "different" },
  { label: "disrupt",             pattern: /\bdisrupt(s|ed|ing)?\b/gi,                 r: "change" },
  { label: "scalable solution",   pattern: /\bscalable solution(s)?\b/gi,              r: "solution" },
  { label: "ever-evolving",       pattern: /\bever[- ]evolving\b/gi,                   r: "changing" },
  { label: "ever-changing",       pattern: /\bever[- ]changing\b/gi,                   r: "changing" },
  { label: "fast-paced world",    pattern: /\bin today'?s fast[- ]paced world[,.]?\s*/gi, r: "" },
  { label: "ever-changing landscape",pattern:/\bin today'?s ever[- ]changing landscape[,.]?\s*/gi, r: "" },
  { label: "in today's world",    pattern: /\bin today'?s world[,.]?\s*/gi,            r: "" },
  { label: "in the modern era",   pattern: /\bin (the )?(modern|current) (era|age|world)[,.]?\s*/gi, r: "" },
  { label: "rapidly evolving",    pattern: /\brapidly evolving\b/gi,                   r: "changing" },
  { label: "landscape",           pattern: /\blandscape\b(?= of| for| in)/gi,          r: "field" },
  { label: "ecosystem",           pattern: /\becosystem\b(?! (of species|service|restoration))/gi, r: "environment" },
  { label: "unpack",              pattern: /\bunpack(s|ed|ing)?\b(?= (the|this|how|what|why))/gi, r: "explain" },
  { label: "explore and discover",pattern: /\bexplore and (discover|understand|uncover)\b/gi, r: "examine" },
  { label: "journey (metaphor)",  pattern: /\bjourney (of|to|toward|into)\b/gi,        r: "path $1" },
  { label: "navigate the complex",pattern: /\bnavigate the (complex|challenging|ever)/gi, r: "handle the" },
  { label: "unlock potential",    pattern: /\bunlock (your|the|its|our|their) (true |full )?potential\b/gi, r: "reach your potential" },
  { label: "unlock opportunities",pattern: /\bunlock (new )?(opportunities|possibilities|capabilities)\b/gi, r: "find $1$2" },
];

// ═══════════════════════════════════════════════════════
// 2. BLOAT RULES  — verbosity, passive voice, auxiliary bloat
//    These run in a second pass labelled separately for stats
// ═══════════════════════════════════════════════════════
const BLOAT_RULES = [

  // Nominalization → verb
  { label: "make a decision",       pattern: /\bmake a decision\b/gi,                          r: "decide" },
  { label: "make an improvement",   pattern: /\bmake (an? )?improvements?\b/gi,                r: "improve" },
  { label: "make a suggestion",     pattern: /\bmake a suggestion\b/gi,                        r: "suggest" },
  { label: "make an attempt",       pattern: /\bmake an attempt\b/gi,                          r: "try" },
  { label: "make use of",           pattern: /\bmake use of\b/gi,                              r: "use" },
  { label: "provide an explanation",pattern: /\bprovide an explanation\b/gi,                   r: "explain" },
  { label: "give a description",    pattern: /\bgive a description\b/gi,                       r: "describe" },
  { label: "reach a conclusion",    pattern: /\breach a conclusion\b/gi,                       r: "conclude" },
  { label: "take into consideration",pattern:/\btake (it )?into consideration\b/gi,            r: "consider" },
  { label: "have an impact on",     pattern: /\bhave an impact on\b/gi,                        r: "affect" },
  { label: "come to an agreement",  pattern: /\bcome to an agreement\b/gi,                     r: "agree" },
  { label: "perform an analysis",   pattern: /\bperform an analysis\b/gi,                      r: "analyze" },
  { label: "give a recommendation", pattern: /\bgive a recommendation\b/gi,                    r: "recommend" },
  { label: "conduct an investigation",pattern:/\bconduct an investigation\b/gi,                r: "investigate" },
  { label: "offer a solution",      pattern: /\boffer a solution\b/gi,                         r: "solve" },

                                        pattern: /\bI[‘’]?ve found a place where I (?:truly )?belong\b/gi,
                                        r: "I feel at home here" },

  // PATTERN I: "I’m proud to be part of X, a [team/org] that values/where Y"
  // Split the appositive into its own sentence
  { label: "proud to be part of X, a team that values Y",
                                        pattern: /\bI[‘’]?m (?:proud|glad|excited|honoured|honored) to be (?:a )?part of ([^,]+),\s+a (?:team|company|group|organisation|organization) (?:that (?:values|believes|champions)|where) ([^.]+)\./gi,
                                        r: (_, org, desc) => `${org.trim()} is where I want to be. The team values ${desc.trim()}.` },
  { label: "proud to be part of",        pattern: /\bI[‘’]?m proud to be (?:a )?part of\b/gi, r: "I’m part of" },

  // PATTERN J: "a team that values X, Y, and Z" standalone
  { label: "a team that values",         pattern: /\ba team that values ([^.!?]+)\b/gi,
                                        r: (_, x) => `a team where ${x.trim()} matter` },

  // PATTERN K: "What drives/motivates/excites me is" — same inversion
  { label: "What drives me is",          pattern: /\bWhat drives me is\b/gi,                 r: "I’m driven by" },
  { label: "What motivates me is",       pattern: /\bWhat motivates me is\b/gi,              r: "I’m motivated by" },
  { label: "What excites me is",         pattern: /\bWhat excites me is\b/gi,                r: "I’m excited by" },

  // PATTERN L: "What I appreciate/value/love most about X is Y" — subject inversion
  // AI favours this fronted "What" clause; use simpler fallback rewrite
  { label: "What I appreciate most about X is Y",
                                        pattern: /\bWhat I (appreciate|value|love|enjoy|like) most about ([^.]+?) is\b/gi,
                                        r: (_, v, subj) => `The standout part of ${subj.trim()} is` },
  { label: "What I appreciate most about (simple)",
                                        pattern: /\bWhat I (appreciate|value|love|enjoy|like) most about\b/gi,
                                        r: "The best part of" },

  // PATTERN M: "not only X, but also Y" — paired correlative (strongest AI signal in formal prose)
  { label: "not only X but also Y",     pattern: /\bnot only ([^,]+),?\s+but also ([^.!?\n]+)/gi,
                                        r: (_, a, b) => `${a.trim()}, and ${b.trim()}` },

  // PATTERN N: "at the same time" as sentence-end intensifier
  { label: "at the same time (end)",    pattern: /,?\s+at the same time\.$/gim,              r: "." },
  { label: "at the same time (mid)",    pattern: /,?\s+at the same time,\s+/gi,              r: ", yet " },

  // PATTERN O: "It could be yours as well" / "It could be X as well" — direct address closer
  { label: "It could be yours as well", pattern: /\bIt could be (yours|theirs|ours|his|hers)(?: as well)?\./gi,
                                        r: (_, pron) => `The same is possible for ${pron === 'yours' ? 'you' : pron}.` },

  // PATTERN P: "inspire you to [verb], [verb], and [verb] every day" — parallel imperative after "inspire"
  { label: "inspire you to V1, V2, and V3",
                                        pattern: /\binspire (?:you|us|them|people) to (\w[^,]+),\s+(\w[^,]+),\s+(?:and )?(\w[^.!?\n]+)/gi,
                                        r: (_, a, b, c) => `inspire ${a.trim()}, ${b.trim()}, and ${c.trim()}` },

  // PATTERN Q: "the culture of [noun/gerund]" — nominalisation pattern common in AI bio text
  { label: "the culture of learning",   pattern: /\bthe culture of (learning|growth|innovation|improvement|collaboration|feedback|excellence)\b/gi,
                                        r: (_, n) => `a culture where ${n} is valued` },

  // PATTERN R: "never seen as X, Y are encouraged, Z are heard" — parallel passive triplet
  // Three balanced passive clauses: very high AI signal
  { label: "parallel passive triplet (X are encouraged, Y are heard)",
                                        pattern: /\b(\w[\w ]+) (?:are|is) (encouraged|heard|welcomed|valued|respected|celebrated),\s+(\w[\w ]+) (?:are|is) (encouraged|heard|welcomed|valued|respected|celebrated)\b/gi,
                                        r: (_, s1, v1, s2) => `${s1.trim()} are ${v1}, and so ${s2.trim()}` },

  // PATTERN S: "X exists in every form, from A to B" — scope expansion closer
  { label: "exists in every form from X to Y",
                                        pattern: /\b(\w[\w ]+) exists in every form,?\s+from ([^,]+) to ([^.!?\n]+)/gi,
                                        r: (_, subj, a, b) => `${subj.trim()} shows up across ${a.trim()} and ${b.trim()}` },

  // PATTERN T: "exciting, intimidating, and full of X" — triple adjective pile
  { label: "exciting intimidating and full of",
                                        pattern: /\b(exciting|thrilling|rewarding|challenging),\s+(intimidating|daunting|overwhelming|humbling),\s+and (full of|filled with) ([^.!?\n,]+)/gi,
                                        r: (_, a, b, _c, d) => `both ${a} and ${b}, with ${d}` },

  // PATTERN U: "beginning of my journey... and the starting point of" — near-synonym doubling
  { label: "beginning of journey and starting point of",
                                        pattern: /\bthe beginning of my journey(?: as a? [^,]+)?,?\s+and the starting point of ([^.!?\n]+)/gi,
                                        r: (_, x) => `where ${x.trim()} began` },

  // PATTERN V: "beginning of my journey as a [role]" standalone — AI career arc opener
  { label: "was the beginning of my journey as a",
                                        pattern: /\bwas the beginning of my journey as a ([^,.\n]+)/gi,
                                        r: (_, role) => `was where I started as a ${role.trim()}` },

  // PATTERN W: "Coming from a path/background where I [verb]..." — participial opener
  // AI loves to open with "Coming from..." to establish backstory; flip to direct statement
  { label: "Coming from a path where I",
                                        pattern: /\bComing from a (path|background|place) where I (\w[^,]+),\s+([^.]+)\./gi,
                                        r: (_, _bg, clause, main) => `I ${clause.trim()}, so ${main.trim()}.` },
  { label: "Coming from (general)",     pattern: /\bComing from\b/gi,                          r: "Having come from" },

  // PATTERN X: "There were moments of X, countless things to Y, and entirely new Z to V"
  // Existential "There were" with parallel triplet — very common AI opening structure
  { label: "There were moments of X countless things to Y",
                                        pattern: /\bThere were moments of ([^,]+), countless things to ([^,]+), and ([^.]+)\./gi,
                                        r: (_, a, b, c) => `The ${a.trim()} was real. There was a lot to ${b.trim()}, and ${c.trim()}.` },
  { label: "There were moments of (simple)",
                                        pattern: /\bThere were moments of\b/gi,                r: "The" },

  // PATTERN Y: "It gave me not only X, but also Y" — pronoun-referent + correlative combo
  // Pattern M catches "not only/but also" mid-sentence; this handles sentence-start "It gave me"
  { label: "It gave me not only X but also Y",
                                        pattern: /\bIt gave me not only ([^,]+),?\s+but also ([^.!?\n]+)/gi,
                                        r: (_, a, b) => `It gave me ${a.trim()}, and ${b.trim()}` },

  // PATTERN Z: "X, Y, and become better every day" — parallel imperative chain closer
  { label: "become better every day",   pattern: /\bbecome better every day\b/gi,              r: "keep improving" },
  { label: "think bigger, challenge yourself", pattern: /\bthink bigger,?\s+challenge yourself\b/gi,
                                        r: "push yourself" },

  // ── Professional assessment / HR document patterns ───────────────────────
  // These fire on structured evaluation text (candidate reports, performance reviews, etc.)

  // "[Name] appears to be the strongest overall candidate, balancing A, B, and alignment with C"
  // Long comma-list verdict sentence — split at the participle
  { label: "appears to be strongest candidate balancing",
                                        pattern: /\b(\w[\w ]+) appears to be the (strongest|best|most suitable|top) (overall )?candidate,?\s+balancing ([^.]+)\./gi,
                                        r: (_, name, sup, _ov, factors) => `${name.trim()} is the ${sup} candidate. ${name.trim().split(' ')[0]} covers ${factors.trim()}.` },

  // "appears to be [adj]" — hedge formula common in AI assessments
  { label: "appears to be",              pattern: /\bappears to be\b/gi,                      r: "is" },

  // "Please let me know if you would like me to provide [more details / additional information]"
  // AI closing offer — very high signal in professional documents
  { label: "please let me know if you would like",
                                        pattern: /\b[Pp]lease let me know if you (?:would like|want|need)(?: me to)? (?:provide |discuss |schedule |arrange )?([^.!?\n]+)\./gi,
                                        r: (_, x) => `Happy to discuss ${x.trim()} further.` },

  // "would like me to provide more details or schedule a [discussion/meeting/call]"
  { label: "provide more details or schedule",
                                        pattern: /\bprovide (?:more|additional|further) details or schedule a ([^.!?\n]+)\./gi,
                                        r: (_, x) => `talk through this further or set up a ${x.trim()}.` },

  // "primarily project-oriented rather than organizational leadership"
  // Evaluative contrast: "X rather than Y" — AI assessment formula
  { label: "primarily X rather than Y (assessment)",
                                        pattern: /\bprimarily ([^.]+?) rather than ([^.!?\n]+)\./gi,
                                        r: (_, a, b) => `more ${a.trim()} than ${b.trim()}.` },

  // "does not meet the experience threshold" — formal negative assessment
  { label: "does not meet the experience threshold",
                                        pattern: /\bdoes not meet the (experience|required|minimum) threshold\b/gi,
                                        r: "falls short of the required experience" },

  // "alignment with the hiring objectives/criteria/requirements"
  { label: "alignment with the hiring objectives",
                                        pattern: /\balignment with the (hiring|role|stated|position) (objectives|criteria|requirements|goals)\b/gi,
                                        r: "fit with the role requirements" },

  // "Strongest overall X with extensive Y and Z" — stacked superlative opener
  { label: "Strongest overall X with extensive Y",
                                        pattern: /\bStrongest overall ([^.]+?) with extensive ([^.]+?)(?: and ([^.]+?))?\./gi,
                                        r: (_, a, b, c) => `Leads on ${a.trim()}. Extensive ${b.trim()}${c ? ` and ${c.trim()}` : ''}.` },

  // "compared to the other candidates" — AI comparative closer
  { label: "compared to the other candidates",
                                        pattern: /\bcompared to the other candidates\b/gi,     r: "relative to the other candidates" },

  // "a more fragmented employment history" — softened negative
  { label: "a more fragmented employment history",
                                        pattern: /\ba more fragmented (employment )?history\b/gi, r: "a less consistent career history" },

  // "experience is primarily X-oriented rather than Y"
  // Already caught by "primarily X rather than Y" above, but catch standalone "X-oriented"
  { label: "experience is primarily X-oriented",
                                        pattern: /\b(experience|background|focus) is primarily (\w[\w-]+)-oriented\b/gi,
                                        r: (_, noun, adj) => `${noun} leans toward ${adj}` },

  // "[Subject], reducing/improving/ensuring [noun phrase]" — participial tail on assessment sentence
  // "Current manager is already aware and supportive of the move, reducing transition risk."
  // The participial tail is a strong AI signal — convert to two plain clauses
  // Only fire when the participial phrase directly follows a complete main clause (main ≥6 words)
  // and does NOT follow a comma that's part of a list (e.g. "management, demonstrating" is
  // a continuation, not a participial tail off a complete clause).
  { label: "X comma reducing/improving/ensuring Y",
                                        pattern: /\b([^,]{20,}),\s+(reducing|improving|ensuring|minimising|minimizing|increasing|limiting|supporting|enabling) ([^.!?\n]+)\./gi,
                                        r: (_, main, verb, obj) => {
                                          const plain = verb.replace(/ing$/, 'es').replace(/([aeiou])ses$/, (m,v) => v + 's');
                                          return `${main.trim()}. This ${plain} ${obj.trim()}.`;
                                        } },

  // "Happy to discuss X further" / "Happy to X" — casual closing formula
  // Replace with a proper professional close
  { label: "Happy to discuss further",  pattern: /\bHappy to discuss ([^.!?\n]+?) further\./gi,
                                        r: (_, x) => `Please reach out if you would like to discuss ${x.trim()} in more detail.` },
  { label: "Happy to X",                pattern: /^Happy to ([^.!?\n]+)\./gim,
                                        r: (_, x) => `I am available to ${x.trim()}.` },

  // "has a less consistent career history relative to the other candidates"
  // "has no X, has a Y" — parallel has-clause pair (two short assertions joined by comma)
  { label: "has no X has a Y (parallel)",
                                        pattern: /\bhas no ([^,]+),\s+has (a |an )?([^.!?\n]+)\./gi,
                                        r: (_, x, art, y) => `No ${x.trim()}. Career history is ${y.trim()}.` },

  // "aware and supportive of the move" — stock phrase in transition/change management AI text
  { label: "aware and supportive of the move",
                                        pattern: /\baware and supportive of the move\b/gi,      r: "informed and supportive" },

  // ── Hiring/assessment document AI register ────────────────────────────────
  // These patterns appear specifically in AI-written candidate evaluations and HR documents

  { label: "a proven track record",      pattern: /\ba proven track record\b/gi,               r: "a track record" },
  { label: "aligns closely with the role", pattern: /\baligns closely with the role\b/gi,      r: "fits the role" },
  { label: "aligns well with the role",  pattern: /\baligns well with the role\b/gi,           r: "fits the role" },
  { label: "is a clear differentiator",  pattern: /\bis a clear differentiator\b/gi,           r: "sets them apart" },
  { label: "a clear differentiator",     pattern: /\ba clear differentiator\b/gi,              r: "a real advantage" },
  { label: "On the X side,",             pattern: /\bOn the ([\w][\w\s-]+?) side,\s*/gi,       r: (_, x) => `${x.trim().charAt(0).toUpperCase()}${x.trim().slice(1)}: ` },
  { label: "proactively",                pattern: /\bproactively\b/gi,                         r: "" },
  { label: "can be onboarded quickly",   pattern: /\bcan be onboarded quickly\b/gi,            r: "can start quickly" },
  { label: "with minimal ramp-up time",  pattern: /\bwith minimal ramp-up time\b/gi,           r: "" },
  { label: "informed his/her manager of his/her intent", pattern: /\binformed (his|her|their) (?:current )?manager of (his|her|their) intent to\b/gi,
                                          r: (_, p1, p2) => `told ${p1} manager ${p2} plan to` },
  { label: "self-awareness and readiness", pattern: /\bself-awareness and readiness\b/gi,      r: "self-awareness" },

  // ── Minimal word-level swaps (individual phrase signals) ─────────────────
  { label: "continuous learning",        pattern: /\bcontinuous learning\b/gi,               r: "learning" },
  { label: "continuous improvement",     pattern: /\bcontinuous improvement\b/gi,            r: "improvement" },
  { label: "continuous growth",          pattern: /\bcontinuous growth\b/gi,                 r: "growth" },
  { label: "diverse perspectives",       pattern: /\bdiverse perspectives\b/gi,              r: "varied perspectives" },
  { label: "build something meaningful", pattern: /\bbuild something meaningful\b/gi,        r: "do work that matters" },
  { label: "the opportunity to",         pattern: /\bthe opportunity to\b/gi,                r: "the chance to" },
  { label: "My work focuses on",         pattern: /\bMy work focuses on\b/gi,                r: "I focus on" },
  { label: "keep systems running smoothly", pattern: /\bkeep (?:their |the )?systems running smoothly\b/gi,
                                        r: "keep systems running" },
  { label: "bring X to the table",       pattern: /\bbring[s]? ([^.]+) to the table\b/gi,
                                        r: (_, x) => `offer ${x.trim()}` },
  { label: "problem-solving mindset",    pattern: /\bproblem[- ]solving mindset\b/gi,        r: "problem-solving instinct" },
  { label: "growth mindset",             pattern: /\bgrowth mindset\b/gi,                    r: "drive to keep improving" },
  { label: "collaborative mindset",      pattern: /\bcollaborative mindset\b/gi,             r: "collaborative approach" },
  { label: "digging deep to",            pattern: /\bdigging deep(?:ly)? to\b/gi,            r: "drilling down to" },

  // ── AI-favourite hedge / filler combos ────────────────────────────────────
  { label: "worth noting",          pattern: /\bworth noting\b/gi,                             r: "notable" },
  { label: "it is clear that",      pattern: /\bit(?:'s| is) clear that\s*/gi,                 r: "" },
  { label: "it is evident that",    pattern: /\bit(?:'s| is) evident that\s*/gi,               r: "" },
  { label: "it is obvious that",    pattern: /\bit(?:'s| is) obvious that\s*/gi,               r: "" },
  { label: "it is apparent that",   pattern: /\bit(?:'s| is) apparent that\s*/gi,              r: "" },
  { label: "it is fair to say",     pattern: /\bit(?:'s| is) fair to say( that)?\s*/gi,        r: "" },
  { label: "it is safe to say",     pattern: /\bit(?:'s| is) safe to say( that)?\s*/gi,        r: "" },
  { label: "without a doubt",       pattern: /\bwithout (a )?doubt[,.]?\s*/gi,                 r: "" },
  { label: "there is no doubt",     pattern: /\bthere(?:'s| is) no doubt( that)?\s*/gi,        r: "" },
  { label: "beyond a shadow",       pattern: /\bbeyond (a shadow of (a )?)?doubt\b/gi,         r: "clearly" },
  { label: "in light of",           pattern: /\bin light of\b/gi,                              r: "given" },
  { label: "in view of",            pattern: /\bin view of\b/gi,                               r: "given" },
  { label: "it follows that",       pattern: /\bit follows that\s*/gi,                         r: "" },
  { label: "as such",               pattern: /\bAs such[,.]?\s*/gi,                            r: "" },
  { label: "as such (mid)",         pattern: /\bas such\b/gi,                                  r: "so" },
  { label: "in other words",        pattern: /\bIn other words[,:]?\s*/gi,                     r: "" },
  { label: "to put it simply",      pattern: /\bTo put it (simply|plainly|bluntly)[,:]?\s*/gi, r: "" },
  { label: "to put it differently", pattern: /\bTo put it differently[,:]?\s*/gi,              r: "" },
  { label: "needless to say",       pattern: /\bNeedless to say[,.]?\s*/gi,                    r: "" },
  { label: "it goes without saying 2",pattern:/\bit goes without saying\b/gi,                  r: "" },
  { label: "first and foremost",    pattern: /\bFirst and foremost[,:]?\s*/gi,                 r: "" },
  { label: "last but not least",    pattern: /\bLast but not least[,:]?\s*/gi,                 r: "" },
  { label: "all in all",            pattern: /\bAll in all[,.]?\s*/gi,                         r: "" },
  { label: "by the same token",     pattern: /\bBy the same token[,.]?\s*/gi,                  r: "" },
  { label: "in the same vein",      pattern: /\bIn the same vein[,.]?\s*/gi,                   r: "" },
  { label: "to this end",           pattern: /\bTo this end[,.]?\s*/gi,                        r: "" },
  { label: "it is worth noting 2",  pattern: /\bIt(?:'s| is) worth (noting|mentioning|highlighting)\b/gi, r: "" },
  { label: "crucially",             pattern: /\bCrucially[,:]?\s*/gi,                          r: "" },
  { label: "interestingly",         pattern: /\bInterestingly[,:]?\s*/gi,                      r: "" },
  { label: "remarkably",            pattern: /\bRemarkably[,:]?\s*/gi,                         r: "" },
  { label: "strikingly",            pattern: /\bStrikingly[,:]?\s*/gi,                         r: "" },
  { label: "unsurprisingly",        pattern: /\bUnsurprisingly[,:]?\s*/gi,                     r: "" },
  { label: "understandably",        pattern: /\bUnderstandably[,:]?\s*/gi,                     r: "" },
  { label: "admittedly",            pattern: /\bAdmittedly[,:]?\s*/gi,                         r: "" },
  { label: "granted",               pattern: /\bGranted[,.]?\s+/gi,                            r: "" },

  // ── Sentence-level AI structural patterns (detected + replaced by structuralRewrite pass) ──
  { label: "is becoming #N",        pattern: /\bIt'?s?\s+becoming\s+#?\w+\s+(overall|in the)/gi, r: (m) => m },
  { label: "locked up #N",          pattern: /\blocked\s+up\s+#?\w+\s+among\b/gi,               r: (m) => m },
  { label: "much closer to",        pattern: /\bmuch\s+closer\s+to\b/gi,                        r: "close to" },
  { label: "than any member is to", pattern: /\bthan\s+any\s+\w+\s+is\s+to\b/gi,               r: "by a wide margin" },
  { label: "keep up those",         pattern: /\bkeep\s+up\s+those\b/gi,                         r: "continue those" },
  { label: "much faster than",      pattern: /\bmuch\s+faster\s+than\b/gi,                      r: "faster than" },
  { label: "much higher",           pattern: /\bmuch\s+higher\b/gi,                             r: "higher" },
  { label: "the next X is no longer Y", pattern: /\bthe\s+next\s+(?:meaningful\s+|key\s+)?(?:milestone|goal|target)\s+is\s+no\s+longer\b/gi, r: "next up:" },

  // ── Business email AI patterns ────────────────────────────────────────────

  { label: "I hope you are well",   pattern: /\bI hope (you('re| are)|this finds you) well[.,]?\s*/gi, r: "" },
  { label: "I am writing to",       pattern: /\bI am writing to\b/gi,                             r: "I am writing to" },

  { label: "at this stage",         pattern: /,?\s*\bat this (stage|juncture|point)\b/gi,          r: "" },
  { label: "Given what I shared",   pattern: /\bGiven what I (shared|mentioned) earlier\b/gi,     r: "Given what I outlined" },
  { label: "Based on what I said",  pattern: /\bBased on what I said\b/gi,                        r: "Given what I outlined" },
  { label: "I'd expect",            pattern: /\bI'?d expect\b/gi,                                 r: "I would anticipate" },
  { label: "I think we'd get",      pattern: /\bI think we'?d get\b/gi,                           r: "I would anticipate" },
  { label: "solid (market eval)",   pattern: /\bthe market for this profile[^.]+(?:is solid|looks good)\b/gi,

  { label: "a much stronger pipeline", pattern: /\ba much stronger pipeline\b/gi,                 r: "a stronger applicant pool" },

  { label: "have been live for",    pattern: /\bhave been live for\b/gi,                          r: "have been open for" },

const INTENSIFIER_RE = /\b(very|really|quite|rather|extremely|incredibly|highly|truly|completely|totally|utterly|simply|literally|obviously|undoubtedly)\s+/gi;

// ═══════════════════════════════════════════════════════
// 4a. BULLET RHYTHM PASS — break uniform parallel bullet lists
//
// AI detectors flag bullet lists not for the words but for the
// STRUCTURE: every line ~same length, same noun-phrase pattern,
// no sentence-ending punctuation. This pass breaks that rhythm
// by joining every other pair of adjacent short bullets with "; "
// and removing the bullet marker — without changing any words.
//
// Only fires when a block has ≥4 consecutive bullet lines.
// ═══════════════════════════════════════════════════════

function bulletRhythmPass(text) {
  let count = 0;
  const lines = text.split('\n');

  const isBullet = line => /^[\s]*[•\-\*]\s+\S/.test(line);
  const stripBullet = line => line.replace(/^[\s]*[•\-\*]\s+/, '').trimEnd();
  const wordCount = s => s.split(/\s+/).length;

  let i = 0;
  const out = [];

  while (i < lines.length) {
    if (isBullet(lines[i])) {
      const run = [];
      while (i < lines.length && isBullet(lines[i])) {
        run.push(stripBullet(lines[i]));
        i++;
      }

      // Only reformat if run is long enough to have a uniform pattern (≥4 bullets)
      if (run.length < 4) {
        // Put bullet markers back for short runs — leave unchanged
        run.forEach((r, idx) => out.push(lines[i - run.length + idx]));
        continue;
      }

      // Asymmetric join pattern to maximise length variance:
      // For n bullets, alternate: join-3, solo, join-2, solo, join-2, ...
      // This creates short (solo ~10w) + long (joined ~25w) lines — high burstiness
      const joined = [];
      let j = 0;

      // First group: try to join 3 if all ≤10 words each
      if (run.length >= 3 &&
          wordCount(run[0]) <= 10 && wordCount(run[1]) <= 10 && wordCount(run[2]) <= 10) {
        joined.push(run[0] + '; ' + run[1].charAt(0).toLowerCase() + run[1].slice(1)
                           + '; ' + run[2].charAt(0).toLowerCase() + run[2].slice(1));
        count++;
        j = 3;
      }

      // Remaining: pair up with "; ", solo if too long or last of odd run
      while (j < run.length) {
        const a = run[j];
        if (j + 1 < run.length && wordCount(a) <= 12 && wordCount(run[j+1]) <= 12) {
          joined.push(a + '; ' + run[j+1].charAt(0).toLowerCase() + run[j+1].slice(1));
          count++;
          j += 2;
        } else {
          joined.push(a);
          j++;
        }
      }

      out.push(...joined);
    } else {
      out.push(lines[i]);
      i++;
    }
  }

  return { text: out.join('\n'), count };
}

// ═══════════════════════════════════════════════════════
// 4b. BURSTINESS PASS — vary sentence length so AI uniformity breaks
//     GPTZero scores burstiness: low variance in length = AI signal.
//     Strategy: split long sentences at natural break points,
//     and collapse series of medium sentences into shorter ones.
// ═══════════════════════════════════════════════════════

function burstisnessPass(text) {
  let splits = 0;

  // Process line by line to preserve structure; only apply to lines that are prose sentences
  const lines = text.split('\n');
  const out = lines.map(line => {
    const trimmed = line.trim();
    // Skip short lines (≤ 8 words) — likely list labels/values, not prose
    if (trimmed.split(/\s+/).length <= 8) return line;

    const rawSents = trimmed.match(/[^.!?]+[.!?]+["']?/g) || [trimmed];
    // If matched fragments cover <80% of the line (e.g. "John F." grabs just an abbrev.),
    // fall back to treating the whole line as one sentence so the tail isn't silently dropped
    const coveredLen = rawSents.reduce((sum, s) => sum + s.length, 0);
    const sents = coveredLen < trimmed.length * 0.8 ? [trimmed] : rawSents;
    const result = [];

    for (let i = 0; i < sents.length; i++) {
      const s = sents[i].trim();
      if (!s) continue;

      const wc = s.split(/\s+/).length;

      // 1. Break "[A] because [B]" — removes the too-clean causal template
      const becauseMatch = s.match(/^(.{20,}?)\s+because\s+(.{20,}[.!?]?)$/i);
      if (becauseMatch) {
        const left  = becauseMatch[1].trim().replace(/[,.]$/, '');
        const right = becauseMatch[2].trim().replace(/[.!?]$/, '');
        const lw = left.split(/\s+/).length;
        const rw = right.split(/\s+/).length;
        if (lw >= 8 && rw >= 6) {
          const rightCap = right.charAt(0).toUpperCase() + right.slice(1);
          result.push(left + '.');
          result.push(rightCap + '.');
          splits++;
          continue;
        }
      }

      // 2b. Break "[Subject] [verb] X but lacks/has no/doesn't Y" — assessment contrast
      //     "Brings strong delivery and transformation experience but lacks hands-on managed cloud depth"
      //     Split at "but" when both halves are ≥6 words — breaks the uniform bullet rhythm
      const butMatch = s.match(/^(.{15,}?)\s+but\s+(lacks?|has no|doesn't|does not|isn't|is not|fails? to)\s+(.{10,}[.!?]?)$/i);
      if (butMatch) {
        const left  = butMatch[1].trim().replace(/[,.]$/, '');
        const mid   = butMatch[2].trim();
        const right = butMatch[3].trim().replace(/[.!?]$/, '');
        if (left.split(/\s+/).length >= 6 && right.split(/\s+/).length >= 4) {
          result.push(left + '.');
          result.push((mid.charAt(0).toUpperCase() + mid.slice(1)) + ' ' + right + '.');
          splits++;
          continue;
        }
      }

      // 2c. Break "However, [clause1], has no [X], and has [Y]" — triple negative assessment
      //     "However, falls short of the required experience, has no people-management experience, and has a more fragmented..."
      //     Split after the first comma clause
      if (/^However,/i.test(s) && s.split(',').length >= 3) {
        const parts = s.replace(/^However,\s*/i, '').split(/,\s*(?:and\s+)?(?=has |lacks |does |isn't |is )/i);
        if (parts.length >= 2 && parts[0].split(/\s+/).length >= 4) {
          const first = parts[0].trim().replace(/[.!?]$/, '');
          const rest  = parts.slice(1).join(', ').trim().replace(/[.!?]$/, '');
          const firstCap = first.charAt(0).toUpperCase() + first.slice(1);
          const restCap  = rest.charAt(0).toUpperCase() + rest.slice(1);
          result.push(firstCap + '.');
          result.push(restCap + '.');
          splits++;
          continue;
        }
      }

      // 2. Break very long sentences (≥30 words) at a comma before a conjunction
      //    Skip dialogue sentences (contain :" or : ") — splitting them destroys the quote structure
      //    Also skip splits where the right clause starts with a bare verb (no subject) — creates fragments
      if (wc >= 30 && !/:\s*["""']/.test(s)) {
        const cutZone = s.slice(Math.floor(s.length * 0.45));
        const cm = cutZone.match(/,\s+(and|but|so|yet|while|though|although|since|because)\s+/i);
        if (cm) {
          const cutPos = Math.floor(s.length * 0.45) + cutZone.indexOf(cm[0]);
          const left  = s.slice(0, cutPos).trim();
          const right = s.slice(cutPos + cm[0].length).trim();
          const rw = right.split(/\s+/).length;
          // Don't split if right clause starts with an auxiliary/main verb (no subject = fragment)
          const startsWithVerb = /^(has|have|had|is|are|was|were|does|do|did|will|would|can|could|should|may|might|must|shall)\b/i.test(right);
          if (rw >= 6 && !startsWithVerb) {
            const rightCap = right.charAt(0).toUpperCase() + right.slice(1);
            const leftClean = left.replace(/[,]$/, '');
            result.push(leftClean + '.');
            result.push(rightCap.replace(/[.!?]$/, '') + '.');
            splits++;
            continue;
          }
        }
      }

      // 2d. Sentence with 4+ comma-separated items (list sentence) — split after item 2
      //     "Piyush covers technical depth, customer engagement, MEA experience, people-management exposure, availability, and fit..."
      //     Detect: ≥4 commas, no sub-clause punctuation (no semicolons), ≥18 words
      if (wc >= 18 && !s.includes(';')) {
        const commaCount = (s.match(/,/g) || []).length;
        if (commaCount >= 4) {
          // Find the 2nd comma and split there
          let c = 0;
          let splitIdx = -1;
          for (let j = 0; j < s.length; j++) {
            if (s[j] === ',') { c++; if (c === 2) { splitIdx = j; break; } }
          }
          if (splitIdx > 0) {
            const left  = s.slice(0, splitIdx).trim();
            const right = s.slice(splitIdx + 1).trim().replace(/^,?\s*/, '');
            if (left.split(/\s+/).length >= 4 && right.split(/\s+/).length >= 5) {
              const rightCap = right.charAt(0).toUpperCase() + right.slice(1);
              result.push(left + '.');
              result.push(rightCap.replace(/^and\s+/i, ''));
              splits++;
              continue;
            }
          }
        }
      }

      result.push(s);
    }

    return result.join(' ');
  });

  return { text: out.join('\n'), splits };
}

const THROAT_CLEAR_RE = /^(So,\s+|Well,\s+|Now,\s+|Basically,\s+|Essentially,\s+|Look,\s+|Listen,\s+)/i;

const OPENER_ALTS = {
  'this':  ['The approach', 'That', 'It'],
