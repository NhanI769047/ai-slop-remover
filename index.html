// Fronted adverbials to inject when 3+ sentences share an opener
const FRONT_ADVERBIALS = [
  'In practice, ', 'For now, ', 'At its core, ', 'In most cases, ',
  'On the whole, ', 'In effect, ', 'For context, ', 'As a result, ',
  'In short, ', 'To be clear, ',
];

function splitSentences(text) {
  return text.split(/(?<=[.!?])\s+(?=[A-Z"'])/).filter(s => s.trim().length > 0);
}

// Split text into processable blocks, always preserving line boundaries.
// Each \n\n-separated paragraph becomes its own block.
// Lines within a paragraph are ALWAYS kept as individual line blocks —
// we never join lines, because email/list line breaks are intentional.
function splitBlocks(text) {
  const paras = text.split(/\n\n+/);
  const blocks = [];
  for (const para of paras) {
    const lines = para.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const isLastInPara = i === lines.length - 1;
      const sep = isLastInPara ? '\n\n' : '\n';
      // Single-line paragraphs → 'para' type (eligible for sentence-level restructuring)
      // Multi-line paragraph lines → 'line' type (preserve as-is, only word-level rules)
      const type = lines.length === 1 ? 'para' : 'line';
      blocks.push({ type, text: lines[i], sep });
    }
  }
  return blocks;
}

function humanize(text) {
  // 1. Strip weak intensifiers
  let intensifierCount = 0;
  text = text.replace(INTENSIFIER_RE, (match, word, offset, str) => {
    const after = str.slice(offset + match.length, offset + match.length + 20);
    if (/^(necessary|required|essential|impossible|certain|sure)\b/i.test(after)) return match;
    intensifierCount++;
    return '';
  });

  const blocks = splitBlocks(text);
  let sentencesSplit = 0;

  const processedBlocks = blocks.map(block => {
    // Short list lines — just clean them, don't restructure
    if (block.type === 'line') {
      return { ...block, text: block.text.trim() };
    }

    let sentences = splitSentences(block.text);

    // 2. Break long compound sentences (>28 words) at a conjunction in the middle third
    sentences = sentences.flatMap(s => {
      const words = s.trim().split(/\s+/);
      if (words.length < 29) return [s];
      const mid = Math.floor(s.length / 3);
      const end = Math.floor(2 * s.length / 3);
      const sub = s.slice(mid, end);
      const cm = sub.match(/,?\s+(and|but|so|yet|while)\s+/i);
      if (!cm) return [s];
      const pos = mid + sub.indexOf(cm[0]);
      const left = s.slice(0, pos).trim().replace(/,$/, '');
      const rightRaw = s.slice(pos + cm[0].length).trim();
      // Don't split if right clause starts with an auxiliary verb — would create a subjectless fragment
      if (/^(has|have|had|is|are|was|were|does|do|did|will|would|can|could|should|may|might|must)\b/i.test(rightRaw)) return [s];
      const right = rightRaw.charAt(0).toUpperCase() + rightRaw.slice(1);
      if (left.split(/\s+/).length < 8 || right.split(/\s+/).length < 8) return [s];
      sentencesSplit++;
      return [left + '.', right];
    });

    // 3. Merge true orphan fragments (≤3 words, no auxiliary) onto prior sentence
    const merged = [];
    for (let i = 0; i < sentences.length; i++) {
      const s = sentences[i];
      const wc = s.trim().split(/\s+/).length;
      if (i > 0 && wc <= 3 && !/\b(is|are|was|were|has|have|had|do|does|did|will|would|can|could|should|may|might)\b/i.test(s)) {
        const prev = merged.pop();
        merged.push(prev.replace(/[.!?]$/, '') + ', ' + s.charAt(0).toLowerCase() + s.slice(1));
      } else {
        merged.push(s);
      }
    }

    // 4. Remove throat-clearing starters
    const cleaned = merged.map(s => {
      const m = s.match(THROAT_CLEAR_RE);
      if (!m) return s;
      const rest = s.slice(m[0].length);
      return rest.charAt(0).toUpperCase() + rest.slice(1);
    });

    // 5. Vary repeated sentence openers
    // First pass: simple word-swap from OPENER_ALTS
    let varied = cleaned.map((s, i) => {
      if (i === 0) return s;
      const prevWord = cleaned[i-1].trim().split(/\s+/)[0].replace(/\W/g,'').toLowerCase();
      const curWord  = s.trim().split(/\s+/)[0].replace(/\W/g,'').toLowerCase();
      if (prevWord !== curWord) return s;
      const alts = OPENER_ALTS[curWord];
      if (!alts) return s;
      const alt = alts.find(a => !cleaned[i-1].startsWith(a)) || alts[0];
      const firstToken = s.match(/^\S+/)[0];
      return alt + s.slice(firstToken.length);
    });

    // Second pass: if 3+ sentences in a row start with same word, inject a fronted adverbial
    for (let i = 2; i < varied.length; i++) {
      const w0 = varied[i-2].trim().split(/\s+/)[0].replace(/\W/g,'').toLowerCase();
      const w1 = varied[i-1].trim().split(/\s+/)[0].replace(/\W/g,'').toLowerCase();
      const w2 = varied[i].trim().split(/\s+/)[0].replace(/\W/g,'').toLowerCase();
      if (w0 === w1 && w1 === w2) {
        const adv = FRONT_ADVERBIALS[i % FRONT_ADVERBIALS.length];
        varied[i] = adv + varied[i].charAt(0).toLowerCase() + varied[i].slice(1);
      }
    }

    return { ...block, text: varied.join(' ') };
  });

  // Reconstruct full text preserving line separators
  let result = '';
  for (const block of processedBlocks) {
    result += block.text + block.sep;
  }

  return { text: result.trimEnd(), intensifierCount, sentencesSplit };
}

// ═══════════════════════════════════════════════════════
// 6. READABILITY  — Flesch Reading Ease
// ═══════════════════════════════════════════════════════

function countSyllables(word) {
  word = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!word) return 0;
  if (word.length <= 3) return 1;
  word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
  word = word.replace(/^y/, '');
  const m = word.match(/[aeiouy]{1,2}/g);
  return m ? m.length : 1;
}

function fleschScore(text) {
  const words = text.trim().split(/\s+/).filter(w => w.length > 0);
  const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
  if (words.length < 5 || sentences.length < 1) return null;
  const totalSyllables = words.reduce((s, w) => s + countSyllables(w), 0);
  const score = 206.835
    - 1.015  * (words.length / sentences.length)
    - 84.6   * (totalSyllables / words.length);
  return Math.round(Math.max(0, Math.min(100, score)));
}

// ═══════════════════════════════════════════════════════
// 7. PRE-PROCESS  — strip AI formatting artifacts before rule passes
// ═══════════════════════════════════════════════════════

function preProcess(text) {
  // 1. Strip AI-decorative emoji used as bullet replacements or section headers.
  //    These are the classic AI "sprinkle" patterns: ✨🔑💡📌🎯🚀(at line start)➡️🔹🔸▶️◆
  //    Human voice emoji (🎉 ✅ 🚀 at end of sentence, standalone) are preserved.
  //    Strategy: remove emoji that appear AT THE START of a line (AI bullet substitute),
  //    or are from the known-decorative set anywhere in text.
  const AI_DECO_EMOJI = /[✨\u{1F511}\u{1F4A1}\u{1F4CC}\u{1F3AF}➡️\u{1F539}\u{1F538}▶◆\u{1F4CD}\u{1F4CB}\u{1F4DD}\u{1F4E2}\u{1F4E3}\u{1F4CA}\u{1F4C8}\u{1F4C9}\u{1F527}\u{1F6A9}]/gu;
  // Remove known AI-decorative icons wherever they appear
  text = text.replace(AI_DECO_EMOJI, '');
  // Remove ANY emoji used as a line-start bullet substitute
  text = text.replace(/^[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}][️]?\s*/gmu, '');
  // Remove variation selectors (invisible modifiers that add nothing)
  text = text.replace(/[\u{FE00}-\u{FE0F}]/gu, '');
  // Clean up spaces left by stripped emoji (but preserve newlines)
  text = text.replace(/[ \t]+/g, ' ').replace(/^ | $/gm, '');

  // 2. Em dash / en dash: preserve as-is. They are legitimate punctuation in professional
  //    writing and titles. Replacing them was causing more damage than it fixed.

  // 3. Markdown heading markers: ## Heading → Heading (keep text, drop #s)
  text = text.replace(/^#{1,6}\s+/gm, '');

  // 4. Bold/italic markdown: **text** or *text* or __text__ or _text_ → text
  text = text.replace(/(\*\*|__)(.*?)\1/gs, '$2');
  text = text.replace(/(\*|_)(.*?)\1/gs, '$2');

  // 5. Inline code backticks: `code` → code
  text = text.replace(/`([^`]+)`/g, '$1');

  // 6. Horizontal rules: ---, ***, ___ on their own line → empty line
  text = text.replace(/^[-*_]{3,}\s*$/gm, '');

  // 7. Bullet/list markers at line start: - item or * item or • item → item
  //    Only strip decorative bullets (not numbered lists — those preserve structure)
  text = text.replace(/^[ \t]*[•]\s+/gm, '');   // bullet • only, not - or *
  // Note: do NOT strip numbered list markers (1. 2.) — they preserve human structure

  // 8. Horizontal rules: ---, ***, ___ on their own line → empty line (already done above)

  // 9. Trailing commas introduced by em-dash removal before sentence end
  text = text.replace(/,\s*([.!?])/g, '$1');

  // 10. Double-commas from back-to-back removals
  text = text.replace(/,\s*,/g, ',');

  // 11. Collapse 3+ blank lines to 2, but KEEP single newlines (preserve list structure)
  text = text.replace(/\n{3,}/g, '\n\n');

  return text.trim();
}

// ═══════════════════════════════════════════════════════
// 8. POST-PROCESS  — artifact cleanup
// ═══════════════════════════════════════════════════════

function postProcess(text) {
  text = text.replace(/[ \t]{2,}/g, ' ');          // collapse horizontal spaces only
  text = text.replace(/[ \t]*,[ \t]*,/g, ',');
  text = text.replace(/^[ \t]*,[ \t]*/gm, '');
  text = text.replace(/[ \t]+([.,!?])/g, '$1');
  text = text.replace(/\.\.+/g, '.');
  text = text.replace(/\.,/g, '.');
  text = text.replace(/\n{3,}/g, '\n\n');          // cap blank lines at 2, keep singles
  // Re-capitalize after sentence-ending punctuation (within same line)
  text = text.replace(/([.!?] +)([a-z])/g, (_, p, l) => p + l.toUpperCase());
  // Capitalize first char of a line only when it starts a new paragraph (preceded by blank
  // line or is at start of text) — avoids force-capitalising intentional continuation lines.
  text = text.replace(/(^|\n\n)([a-z])/g, (_, pre, ch) => pre + ch.toUpperCase());
  text = text.replace(/[ \t]{2,}/g, ' ').trim();
  return text;
}

// ═══════════════════════════════════════════════════════
// 9. CORE PIPELINE
// ═══════════════════════════════════════════════════════

function applyRules(text, rules) {
  let count = 0;
  for (const rule of rules) {
    const before = text;
    text = text.replace(rule.pattern, rule.r);
    if (text !== before) count++;
  }
  return { text, count };
}

function applyContractions(text) {
  let count = 0;
  for (const rule of CONTRACTION_RULES) {
    const before = text;
    text = text.replace(rule.pattern, rule.r);
    if (text !== before) count++;
  }
  return { text, count };
}

// ═══════════════════════════════════════════════════════
// STRUCTURAL REWRITE PASS
// Rewrites whole-sentence AI templates. Each rule is a
// {test, rewrite} pair — test matches the full line,
// rewrite returns the replacement. Safer than mid-sentence
// regex that creates artifacts.
// ═══════════════════════════════════════════════════════

function structuralRewrite(text) {
  let count = 0;

  // Rules: [ test_regex, rewrite_fn ]
  // test_regex matches the FULL line (or a dominant phrase in it)
  // rewrite_fn receives the full regex match + capture groups
  const STRUCT_RULES = [

    // "You're now much closer to passing X than any member is to catching you."
    [/\bYou'?re?\s+now\s+(?:much\s+)?closer\s+to\s+passing\s+([\w\s]+?)\s+than\s+any\s+\w+\s+is\s+to\s+catching\s+you[.!]?/i,
     (m, target) => `You're well ahead of ${target.trim()} at this point.`],

    // "If you keep up those X days, the next [goal] is [no longer / isn't anymore] [defending/Y]."
    [/\bIf\s+you\s+(?:continue|keep\s+up)\s+([\w\s]+?),\s+the\s+next\s+(?:goal|milestone|target|step)\s+(?:is(?:n't)?\s+)?(?:no\s+longer\s+|not\s+anymore\s+|anymore\s+)?([^.!?]{5,})[.!]?/i,
     (m, cond, nxt) => `Keep up ${cond.trim()} and ${nxt.trim()} becomes the next challenge.`],

    // "It's becoming #1 overall in the entire group."
    [/\bIt'?s?\s+becoming\s+(#?(?:\d+|first|second|third))\s+(overall\b[^.!?]*?)[.!]?\s*$/i,
     (m, rank, scope) => `Going for ${rank} ${scope.trim()} is now a real target.`],

    // "You've/You have [effectively] locked up #1 among members."
    [/\bYou(?:'ve|\s+have)\s+(?:effectively\s+)?locked\s+up\s+(#?\w+)\s+among\s+([\w\s]+?)[.!]?$/i,
     (m, rank, grp) => `${rank} in ${grp.trim()} is yours.`],

    // "That's [much] faster than [earlier guesses/expected] because [reason]."
    [/\bThat'?s?\s+(?:much\s+)?faster\s+than\s+([\w\s]+?)\s+because\s+([^.!?]{8,})[.!]?/i,
     (m, prev, reason) => `Faster than ${prev.trim()}. ${reason.trim().charAt(0).toUpperCase() + reason.trim().slice(1)}.`],

    // "You would likely pass her in approximately X days."
    [/\bYou\s+would\s+likely\s+pass\s+(\w+)\s+in\s+(?:approximately\s+|about\s+)?([\w\s\-–]+days?)[.!]?/i,
     (m, name, time) => `At this rate, ${name} falls behind you in ${time.trim()}.`],

    // "Assuming X remains around Y:"
    [/^Assuming\s+([\w\s]+?)\s+remains?\s+around\s+([\w.k]+)[:]?$/i,
     (m, who, val) => `If ${who.trim()} stays near ${val.trim()}:`],

    // "X is now much closer to Y"  (generic)
    [/\b([\w']+(?:\s+[\w']+){0,3})\s+(?:is|are)\s+now\s+much\s+closer\s+to\s+([\w\s]+)/i,
     (m, subj, dest) => `${subj} is closing in on ${dest.trim()}`],

    // "X has become [much] higher/lower/better/worse"
    [/\b([\w\s']+?)\s+has\s+become\s+(?:much\s+)?(higher|lower|better|worse|faster|slower)\b/i,
     (m, subj, dir) => `${subj.trim()} is ${dir} now`],

    // "That's much faster than expected because your average has become higher."
    // (catches residual after rule 5 — the "become higher" leftover)
    [/\bhas\s+become\s+(?:much\s+)?(higher|lower|better|worse)\b/i,
     (m, dir) => `went ${dir === 'higher' || dir === 'better' ? 'up' : 'down'}`],

    // "your own average is now much higher" → "your average jumped"
    [/\byour\s+own\s+(average|pace|rate|score|total)\s+is\s+(?:now\s+)?(?:much\s+)?(higher|lower|better|worse|faster|slower)\b/i,
     (m, metric, dir) => `your ${metric} ${dir === 'higher' || dir === 'better' || dir === 'faster' ? 'jumped' : 'dropped'}`],

    // "Right now:" standalone (leftover from current situation rule — handled in SLOP_RULES now)
    // kept as safety net
    [/^Right\s+now\s*[:]?$/i,
     () => `Where things stand:`],

    // ── AI rhetorical binary questions: "Does/Can the employee X, or are they Y?" ──
    // Greedy: hits the LAST ", or are/is they" (handles mid-sentence "or" like "product or a process")
    // "Can the employee X?" → "The employee can X."
    // "Does the employee X?" → "The employee Xs." (positive already conjugated)
    [/^((?:\d+\.\s+)?[\w\s]+:\s*)(Does|Can)\s+the\s+employee\s+(.+),\s+or\s+(?:are|is)\s+they\s+[^?]+\?$/i,
     (m, label, modal, positive) => {
       const p = positive.trim();
       if (/^can$/i.test(modal)) return `${label}The employee can ${p[0].toLowerCase()}${p.slice(1)}.`;
       return `${label}The employee ${p[0].toLowerCase()}${p.slice(1)}.`;
     }],

    // "Does this role allow the employee to X, or is every single move Y?"
    [/^((?:\d+\.\s+)?[\w\s]+:\s*)Does\s+this\s+role\s+allow\s+the\s+employee\s+to\s+(.+),\s+or\s+is\s+[^?]+\?$/i,
     (m, label, positive) => {
       // conjugate first verb: "drive their own schedule" → "drives their own schedule"
       const conj = positive.trim().replace(/^(\w+)/, v => v + 's');
       return `${label}The employee ${conj}.`;
     }],

    // "Does the employee understand/know/see X?" (direct question, no binary)
    [/^((?:\d+\.\s+)?[\w\s]+:\s*)Does\s+the\s+employee\s+(understand|know|see|grasp|recognize)\s+(.+)\?$/i,
     (m, label, verb, rest) => `${label}The employee ${verb}s ${rest.trim()}.`],

    // "These elements drive three/four/N essential/core/fundamental psychological states — X, Y, and Z —
    //  creating an environment where individuals feel A, B, and C."
    [/These\s+elements\s+drive\s+(?:\w+\s+)*(?:psychological\s+states?|dimensions?|factors?)\s*[-–—,]\s*([^–—,]+(?:[,]\s*[^–—,]+)*)\s*[-–—,][^.]+?\bwhere\s+individuals?\s+feel\s+([^.]+)\./i,
     (m, states, feelings) => {
       const stateList = states.split(/,\s*(?:and\s+)?/).map(s => s.trim()).filter(Boolean);
       const feelList  = feelings.split(/,\s*(?:and\s+)?/).map(s => s.trim()).filter(Boolean);
       const lastState = stateList.pop();
       const lastFeel  = feelList.pop();
       const statesStr = stateList.length ? stateList.join(', ') + ' and ' + lastState : lastState;
       const feelsStr  = feelList.length  ? feelList.join(', ')  + ' and ' + lastFeel  : lastFeel;
       return `When ${statesStr} are in place, people show up ${feelsStr}.`;
     }],

    // "Now we can see that X isn't Y; it's Z."  →  "X isn't Y. It's Z."
    [/Now\s+we\s+can\s+see\s+that\s+([^;.]+?);\s+it'?s?\s+([^.]+)\./i,
     (m, clause1, clause2) => `${clause1.trim().charAt(0).toUpperCase()}${clause1.trim().slice(1)}. It's ${clause2.trim()}.`],

    // "X isn't something we provide; it's something we embed/build/create"
    [/([A-Z][^;.]+?)\s+isn'?t\s+something\s+we\s+provide;\s+it'?s\s+something\s+we\s+(\w+)\s+([^.]+)\./i,
     (m, subj, verb, rest) => `You can't hand ${subj.toLowerCase()} to someone. You ${verb} it ${rest.trim()}.`],
  ];

  const lines = text.split('\n');
  const out = lines.map(line => {
    const trimmed = line.trim();
    if (!trimmed) return line;

    let s = trimmed;
    const before = s;

    for (const [re, fn] of STRUCT_RULES) {
      s = s.replace(re, fn);
      if (s !== before) break; // one structural change per line — avoids double-firing
    }

    if (s !== before) {
      count++;
      s = s.charAt(0).toUpperCase() + s.slice(1);
      // Ensure sentence ends with punctuation
      if (s.length > 0 && !/[.!?:]$/.test(s)) s += '.';
    }
    return s;
  });

  return { text: out.join('\n'), count };
}

function countFormattingStrips(original, processed) {
  // Count emoji stripped
  const emojiRe = /[\u{1F300}-\u{1FFFF}☀-➿\u{FE00}-\u{FE0F}]/gu;
  const emojiCount = (original.match(emojiRe) || []).length;
  // Em/en dashes are no longer converted — don't count them
  // Count markdown headers
  const headerCount = (original.match(/^#{1,6}\s+/gm) || []).length;
  // Count bold/italic markers (pairs)
  const boldCount = (original.match(/\*\*[^*]+\*\*/g) || []).length
                  + (original.match(/__[^_]+__/g) || []).length;
  return emojiCount + headerCount + boldCount;
}

function cleanText(rawText) {
  // Pass 0a: bullet rhythm — must run BEFORE pre-process strips bullet markers
  const { text: tBullet, count: bulletJoins } = bulletRhythmPass(rawText);

  // Pass 0b: pre-process (emoji, em-dashes, markdown)
  const preProcessed = preProcess(tBullet);
  const formatStrips = countFormattingStrips(rawText, preProcessed);
  let text = preProcessed;

  // Pass 1: slop (includes GPTZero-targeted perplexity rules)
  let { text: t1, count: slopCount } = applyRules(text, SLOP_RULES);
  text = postProcess(t1);

  // Pass 2: bloat
  let { text: t2, count: bloatCount } = applyRules(text, BLOAT_RULES);
  text = postProcess(t2);

  // Pass 3: contractions
  let { text: t3, count: contractionCount } = applyContractions(text);
  text = postProcess(t3);

  // Pass 4: burstiness — break causal chains and very long sentences
  const { text: t4b, splits: burstSplits } = burstisnessPass(text);
  text = postProcess(t4b);

  // Pass 5: structural sentence rewrites — attack AI sentence templates
  const { text: t5s, count: rewriteCount } = structuralRewrite(text);
  text = postProcess(t5s);

  // Pass 6: humanize (structure + rhythm + intensifiers)
  const { text: t6, intensifierCount, sentencesSplit } = humanize(text);
  text = postProcess(t6);

  const totalSplits = sentencesSplit + burstSplits;
  return { cleaned: text, slopCount: slopCount + rewriteCount + bulletJoins, bloatCount, contractionCount, intensifierCount, sentencesSplit: totalSplits, formatStrips };
}

function countWords(text) {
  return text.trim() ? text.trim().split(/\s+/).length : 0;
}

// ═══════════════════════════════════════════════════════
// 9. DETECT  — for live badge + found list
// ═══════════════════════════════════════════════════════

function detect(text) {
  const found = [];
  const allRules = [...SLOP_RULES, ...BLOAT_RULES];
  for (const rule of allRules) {
    const flags = rule.pattern.flags.includes('g') ? rule.pattern.flags : rule.pattern.flags + 'g';
    const matches = [...text.matchAll(new RegExp(rule.pattern.source, flags))];
    if (matches.length > 0) {
      found.push({ label: rule.label, count: matches.length });
    }
  }
  return found;
}

// ═══════════════════════════════════════════════════════
// 10. WORD-LEVEL DIFF
// ═══════════════════════════════════════════════════════

// Tokenize into words + whitespace/punctuation tokens so we can reconstruct exact spacing
function tokenize(text) {
  // Split on whitespace boundaries, keeping whitespace as tokens
  return text.split(/(\s+)/).filter(t => t.length > 0);
}

// Longest Common Subsequence on token arrays (word-level, ignoring whitespace tokens)
function lcs(a, b) {
  const m = a.length, n = b.length;
  // Use two-row DP to save memory
  let prev = new Uint16Array(n + 1);
  let curr = new Uint16Array(n + 1);
  // Build table but only store the backtrace we need via a flat array
  const dp = new Array(m + 1).fill(null).map(() => new Uint16Array(n + 1));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (a[i-1] === b[j-1]) {
        dp[i][j] = dp[i-1][j-1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
      }
    }
  }
  // Traceback
  const common = [];
  let i = m, j = n;
  while (i > 0 && j > 0) {
    if (a[i-1] === b[j-1]) {
      common.push([i-1, j-1]);
      i--; j--;
    } else if (dp[i-1][j] >= dp[i][j-1]) {
      i--;
    } else {
      j--;
    }
  }
  return common.reverse();
}

// Build diff ops: [{type:'eq'|'del'|'ins', val:string}]
function diffTokens(oldText, newText) {
  // Work only on non-whitespace tokens for the LCS, then reconstruct
  const oldToks = oldText.split(/(\s+)/);
  const newToks = newText.split(/(\s+)/);

  // Filter to just word tokens (non-whitespace) with their original indices
  const oldWords = oldToks.map((t, i) => ({ t, i })).filter(x => x.t.trim().length > 0);
  const newWords = newToks.map((t, i) => ({ t, i })).filter(x => x.t.trim().length > 0);

  const oa = oldWords.map(x => x.t.toLowerCase());
  const na = newWords.map(x => x.t.toLowerCase());

  // Bail out on very large texts to avoid freezing (>600 word-tokens each)
  if (oa.length > 600 || na.length > 600) {
    return [{ type: 'ins', val: newText }];
  }

  const common = lcs(oa, na);

  const ops = [];
  let oi = 0, ni = 0, ci = 0;

  while (ci < common.length) {
    const [coi, cni] = common[ci];
    // deleted words before this common point
    while (oi < coi) {
      ops.push({ type: 'del', val: oldWords[oi].t });
      oi++;
    }
    // inserted words before this common point
    while (ni < cni) {
      ops.push({ type: 'ins', val: newWords[ni].t });
      ni++;
    }
    ops.push({ type: 'eq', val: newWords[ni].t });
    oi++; ni++; ci++;
  }
  // remaining deletions
  while (oi < oldWords.length) {
    ops.push({ type: 'del', val: oldWords[oi].t });
    oi++;
  }
  // remaining insertions
  while (ni < newWords.length) {
    ops.push({ type: 'ins', val: newWords[ni].t });
    ni++;
  }

  return ops;
}

function renderDiff(oldText, newText, showDiff) {
  if (!showDiff) {
    // Preserve newlines as <br> in plain mode
    return escapeHtml(newText).replace(/\n/g, '<br>');
  }

  const ops = diffTokens(oldText, newText);
  let html = '';

  for (let i = 0; i < ops.length; i++) {
    const op = ops[i];
    const next = ops[i + 1];
    const esc = escapeHtml(op.val);

    if (op.type === 'eq') {
      html += esc;
    } else if (op.type === 'del') {
      html += `<span class="diff-del">${esc}</span>`;
    } else if (op.type === 'ins') {
      html += `<span class="diff-add">${esc}</span>`;
    }

    // After each word token, emit the original whitespace (preserving newlines as <br>)
    // If next token exists and isn't punctuation, add a space; if it's a newline context, add <br>
    if (i < ops.length - 1) {
      const nextVal = ops[i+1]?.val || '';
      if (!/^[.,!?;:)}\]'"»]/.test(nextVal)) {
        html += ' ';
      }
    }
  }

  // If output has newlines, do line-by-line diff to preserve structure
  if (newText.includes('\n')) {
    const oldLines = oldText.split('\n');
    const newLines = newText.split('\n');
    return newLines.map((newLine, i) => {
      const oldLine = oldLines[i] ?? '';
      if (newLine === oldLine) return escapeHtml(newLine);
      // Inline word-level diff per line
      const lineOps = diffTokens(oldLine, newLine);
      let lineHtml = '';
      for (let j = 0; j < lineOps.length; j++) {
        const lop = lineOps[j];
        const lesc = escapeHtml(lop.val);
        if (lop.type === 'eq')  lineHtml += lesc;
        else if (lop.type === 'del') lineHtml += `<span class="diff-del">${lesc}</span>`;
        else if (lop.type === 'ins') lineHtml += `<span class="diff-add">${lesc}</span>`;
        if (j < lineOps.length - 1) {
          const nextVal = lineOps[j+1]?.val || '';
          if (!/^[.,!?;:)}\]'"»]/.test(nextVal)) lineHtml += ' ';
        }
      }
      return lineHtml || escapeHtml(newLine);
    }).join('<br>');
  }

  return html;
}

// ═══════════════════════════════════════════════════════
// 11. UI
// ═══════════════════════════════════════════════════════

let highlightOn = false;
let lastFound   = [];
let showDiff    = true;
let lastInput   = '';
let lastCleaned = '';

function onInput() {
  const text = document.getElementById('input').value;
  const found = detect(text);
  lastFound = found;
  const total = found.reduce((s, f) => s + f.count, 0);

  const badge = document.getElementById('badge-slop');
  if (total > 0) {
    badge.textContent = total + ' issues';
    badge.classList.remove('badge-hidden');
  } else {
    badge.classList.add('badge-hidden');
  }

  if (highlightOn) renderHighlight(text, found);
  renderFoundList(found);
}

function clean() {
  const text = document.getElementById('input').value.trim();
  if (!text) return;

  const found = detect(text);
  const { cleaned, slopCount, bloatCount, contractionCount, intensifierCount, sentencesSplit, formatStrips } = cleanText(text);

  lastInput   = text;
  lastCleaned = cleaned;

  // Hidden textarea for copy
  document.getElementById('output').value = cleaned;

  // Diff display
  document.getElementById('output-display').innerHTML = renderDiff(text, cleaned, showDiff);

  const totalIssues = found.reduce((s, f) => s + f.count, 0);
  document.getElementById('stat-in-words').textContent    = countWords(text);
  document.getElementById('stat-out-words').textContent   = countWords(cleaned);
  document.getElementById('stat-slop').textContent        = totalIssues;
  document.getElementById('stat-format').textContent      = formatStrips;
  document.getElementById('stat-contractions').textContent = contractionCount;
  document.getElementById('stat-bloat').textContent       = bloatCount;
  document.getElementById('stat-splits').textContent      = sentencesSplit;
  document.getElementById('stat-intensifiers').textContent = intensifierCount;

  const fs = fleschScore(cleaned);
  if (fs !== null) {
    document.getElementById('stat-flesch').textContent = fs;
    document.getElementById('stat-flesch').className = 'stat-val ' +
      (fs >= 60 ? 'green' : fs >= 40 ? 'yellow' : 'red');
    const fill = document.getElementById('flesch-fill');
    fill.style.width = fs + '%';
    fill.style.background = fs >= 60 ? 'var(--green)' : fs >= 40 ? 'var(--yellow)' : 'var(--red)';
  }

  const badge = document.getElementById('badge-clean');
  badge.textContent = (slopCount + bloatCount + contractionCount + intensifierCount + sentencesSplit + formatStrips) + ' fixed';
  badge.classList.remove('badge-hidden');
}

function toggleDiff() {
  showDiff = document.getElementById('diff-toggle').checked;
  if (lastCleaned) {
    document.getElementById('output-display').innerHTML = renderDiff(lastInput, lastCleaned, showDiff);
  }
}

function copyOutput() {
  const val = document.getElementById('output').value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').value = '';
  document.getElementById('output-display').innerHTML = '';
  lastInput = ''; lastCleaned = '';
  ['badge-slop','badge-clean'].forEach(id => document.getElementById(id).classList.add('badge-hidden'));
  document.getElementById('preview-in').style.display = 'none';
  document.getElementById('found-list').style.display = 'none';
  ['stat-in-words','stat-out-words','stat-slop','stat-format','stat-contractions',
   'stat-bloat','stat-splits','stat-intensifiers','stat-flesch']
    .forEach(id => { document.getElementById(id).textContent = '—'; });
  document.getElementById('flesch-fill').style.width = '0%';
  lastFound = [];
}

function toggleHighlight() {
  highlightOn = document.getElementById('highlight-toggle').checked;
  const previewEl = document.getElementById('preview-in');
  const inputEl   = document.getElementById('input');
  if (highlightOn) {
    inputEl.style.display = 'none';
    previewEl.style.display = 'block';
    renderHighlight(inputEl.value, lastFound);
  } else {
    inputEl.style.display = 'block';
    previewEl.style.display = 'none';
  }
}

function renderHighlight(text, found) {
  const el = document.getElementById('preview-in');
  if (!highlightOn) return;
  const allRules = [...SLOP_RULES, ...BLOAT_RULES];
  const patterns = allRules
    .filter(r => found.some(f => f.label === r.label))
    .map(r => r.pattern.source);
  if (!patterns.length) { el.innerHTML = escapeHtml(text); return; }
  try {
    const combined = new RegExp('(' + patterns.join('|') + ')', 'gi');
    // Escape first, then wrap matches — do NOT re-escape the matched portion (already escaped)
    el.innerHTML = escapeHtml(text).replace(combined, m => `<mark>${m}</mark>`);
  } catch(e) {
    el.innerHTML = escapeHtml(text);
  }
}

function renderFoundList(found) {
  const el = document.getElementById('found-list');
  if (!found.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = found.map(f => `<span title="${f.count}×">${f.label} ×${f.count}</span>`).join('');
}

function escapeHtml(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
